<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EarnBots Mini App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Telegram Mini App API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #fff;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .stat {
      font-size: 26px;
      font-weight: bold;
      color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }

    button:hover {
      background: #1d4ed8;
    }

    .task {
      background: #020617;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .task small {
      color: #94a3b8;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  🚀 EarnBots Mini App
</header>

<div class="container">

  <div class="card">
    <h3>👤 User</h3>
    <div id="username">Loading...</div>
  </div>

  <div class="card">
    <h3>💰 Balance</h3>
    <div class="stat" id="balance">0</div>
    <button onclick="withdraw()">Withdraw</button>
  </div>

  <div class="card">
    <h3>📋 Available Tasks</h3>
    <div id="tasks"></div>
    <button onclick="refreshTasks()">Refresh Tasks</button>
  </div>

  <div class="card">
    <h3>👥 Referral</h3>
    <small>Your referral link</small>
    <div id="referral"></div>
    <button onclick="copyReferral()">Copy Link</button>
  </div>

</div>

<footer>
  EarnBots © 2026 · Telegram Mini App
</footer>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const user = tg.initDataUnsafe.user;

  document.getElementById("username").innerText =
    user ? `${user.first_name} (@${user.username || "no_username"})` : "Guest";

  const USER_ID = user?.id || 0;
  const BOT_USERNAME = "cashbot";

  // DEMO DATA (replace with API later)
  let balance = 1200;
  let tasks = [
    { title: "Join Telegram Channel", reward: 50 },
    { title: "Follow Instagram Page", reward: 100 },
    { title: "Watch Sponsored Video", reward: 150 }
  ];

  document.getElementById("balance").innerText = balance;

  function renderTasks() {
    const el = document.getElementById("tasks");
    el.innerHTML = "";

    tasks.forEach((t, i) => {
      const div = document.createElement("div");
      div.className = "task";
      div.innerHTML = `
        <b>${t.title}</b><br>
        <small>Reward: ${t.reward} coins</small>
        <button onclick="completeTask(${i})">Complete</button>
      `;
      el.appendChild(div);
    });
  }

  function completeTask(index) {
    balance += tasks[index].reward;
    document.getElementById("balance").innerText = balance;
    tg.showAlert("✅ Task completed!");
  }

  function withdraw() {
    tg.showAlert("💸 Withdrawals are handled by the bot.");
    tg.close();
  }

  function refreshTasks() {
    tg.showAlert("🔄 Tasks refreshed");
  }

  const referralLink =
    `https://t.me/${BOT_USERNAME}?start=${USER_ID}`;
  document.getElementById("referral").innerText = referralLink;

  function copyReferral() {
    navigator.clipboard.writeText(referralLink);
    tg.showAlert("📋 Referral link copied!");
  }

  renderTasks();
</script>

</body>
    </html>
